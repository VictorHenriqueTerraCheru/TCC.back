services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ocorrencias
      POSTGRES_PASSWORD: ocorrencias
      POSTGRES_DB: ocorrencias
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocorrencias"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
